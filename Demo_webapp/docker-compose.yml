services:

  web_db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"          # host access for MySQL Workbench/CLI; drop this in production
    volumes:
      - db_data:/var/lib/mysql
      # Only runs on a truly empty data dir (first-ever start) -- mysql's
      # entrypoint executes every *.sql it finds here once, alphabetically.
      - ./web_api/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [smartbiopep-net]

  # Mock API for now (web_api/app.py) -- swap the build block below for a
  # real api/ service once one exists; everything else (env vars, network,
  # depends_on) stays the same since the frontend only knows it as "api".
  web_api:
    build:
      context: ./web_api
      dockerfile: Dockerfile${DEV_MODE}
      network: host # Needed when build at the internal server
    restart: unless-stopped
    environment:
      DB_HOST: web_db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      SMARTBIOPEP_APP_URL: ${SMARTBIOPEP_APP_URL}
      # The single login account -- auth.py seeds it into MySQL at startup
      # and refuses to start without APP_PASSWORD. See .env
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
      APP_EMAIL: ${APP_EMAIL}
    ports:
      - "8000:8000"
    depends_on:
      web_db:
        condition: service_healthy
    networks: [smartbiopep-net]

  web_ui:
    build:
      context: ./web_ui
      dockerfile: Dockerfile
      network: host # Needed when build at the internal server
    restart: unless-stopped
    environment:
      SMARTBIOPEP_API_BASE_URL: http://web_api:8000
    ports:
      - "8501:8501"
    depends_on:
      - web_api
    networks: [smartbiopep-net]

networks:
  smartbiopep-net:
    driver: bridge


volumes:
  db_data:
