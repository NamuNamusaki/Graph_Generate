services:

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"          # host access for MySQL Workbench/CLI; drop this in production
    volumes:
      - db_data:/var/lib/mysql
      # Only runs on a truly empty data dir (first-ever start) -- mysql's
      # entrypoint executes every *.sql it finds here once, alphabetically.
      - ./web_api/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [smartbiopep-net]

  # Mock API for now (web_api/app.py) -- swap the build block below for a
  # real api/ service once one exists; everything else (env vars, network,
  # depends_on) stays the same since the frontend only knows it as "api".
  api:
    build:
      context: ./web_api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      SMARTBIOPEP_APP_URL: ${SMARTBIOPEP_APP_URL}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [smartbiopep-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SMARTBIOPEP_API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    networks: [smartbiopep-net]

  # Placeholder broker for the queue. Redis is the simplest option that works
  # with most Python task-queue libraries (Celery, RQ, arq); swap the image
  # for rabbitmq:3-management if you'd rather use RabbitMQ/AMQP instead.
  queue:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [smartbiopep-net]

  # No worker code exists yet, so this is commented out rather than faked.
  # Uncomment once there's a worker/ folder with its own Dockerfile that:
  #   1. Connects to `queue` (Redis) to pull jobs enqueued by the api service
  #   2. Runs the actual bioactivity-prediction pipeline
  #   3. Writes results/updates job status via `db`, the same way db.py does
  # worker:
  #   build:
  #     context: ./worker
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   environment:
  #     DB_HOST: db
  #     DB_PORT: 3306
  #     DB_USER: root
  #     DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  #     DB_NAME: ${MYSQL_DATABASE}
  #     QUEUE_URL: redis://queue:6379/0
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     queue:
  #       condition: service_started
  #   networks: [smartbiopep-net]

networks:
  smartbiopep-net:
    driver: bridge

volumes:
  db_data:
